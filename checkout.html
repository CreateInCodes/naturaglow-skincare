<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Checkout | NaturaGlow Skincare</title>
  <meta name="description" content="Secure checkout for your NaturaGlow organic skincare order. Supports UPI, Cash on Delivery, and cards." />
  <meta property="og:title" content="Secure Checkout | NaturaGlow" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar">
    ✨ Secure Checkout | 100% Safe & Encrypted Transactions
  </div>

  <!-- Header -->
  <header>
    <div class="container header-inner">
      <a href="/" class="logo">NaturaGlow</a>
      <div style="font-size: 0.9rem; font-weight: 600; color: var(--color-primary);">🔒 Secure SSL Checkout</div>
    </div>
  </header>

  <!-- Checkout Content -->
  <main class="container" style="padding: 3rem 0;">
    <div id="checkout-wrapper">
      <!-- Rendered via JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container" style="text-align: center;">
      <p>&copy; 2026 NaturaGlow Skincare (naturaglowskincare.com). All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/products.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cart = getCart();
      const wrapper = document.getElementById('checkout-wrapper');

      if (cart.length === 0) {
        wrapper.innerHTML = `
          <div style="text-align: center; padding: 4rem 1rem;">
            <h2>Your cart is empty</h2>
            <p style="margin: 1rem 0 2rem; color: var(--color-text-muted);">Please add items to your bag before checking out.</p>
            <a href="/shop.html" class="btn btn-primary">Return to Shop</a>
          </div>
        `;
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const shipping = subtotal >= 499 ? 0 : 99;
      const total = subtotal + shipping;

      wrapper.innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr; gap: 3rem;" class="checkout-grid">
          <div>
            <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--color-text);">Shipping & Contact Details</h2>
            
            <form id="checkout-form" onsubmit="handleCheckoutSubmit(event)" style="display: flex; flex-direction: column; gap: 1.25rem;">
              <div>
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem;">Full Name *</label>
                <input type="text" id="cust-name" required placeholder="Aarav Sharma" style="width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 1rem;" />
              </div>

              <div>
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem;">WhatsApp / Mobile Number *</label>
                <input type="tel" id="cust-phone" required placeholder="+91 98765 43210" style="width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 1rem;" />
              </div>

              <div>
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem;">Delivery Address *</label>
                <textarea id="cust-address" required rows="3" placeholder="House/Flat No., Street, Landmark, City, State, Pincode" style="width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 1rem; font-family: inherit;"></textarea>
              </div>

              <h3 style="font-size: 1.25rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: var(--color-text);">Select Payment Method</h3>
              
              <div style="display: flex; flex-direction: column; gap: 1rem;">
                <label style="display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: white; cursor: pointer;">
                  <input type="radio" name="payment-method" value="UPI" checked onclick="togglePaymentView('UPI')" />
                  <div>
                    <strong>UPI QR Code (GPay / PhonePe / Paytm / BHIM)</strong>
                    <div style="font-size: 0.85rem; color: var(--color-text-muted);">Instant scan & pay via any UPI app</div>
                  </div>
                </label>

                <div id="upi-qr-box" style="background: #F4F7F5; padding: 1.5rem; border-radius: var(--radius-sm); text-align: center; border: 1px dashed var(--color-primary);">
                  <div style="font-weight: 600; margin-bottom: 0.5rem; color: var(--color-primary);">Scan UPI QR Code to Pay ₹${total}</div>
                  <div style="background: white; width: 160px; height: 160px; margin: 0.75rem auto; display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-border); font-size: 0.8rem; color: var(--color-text-muted); border-radius: 8px;">
                    [ UPI QR CODE ]<br/>naturaglow@okaxis
                  </div>
                  <div style="font-size: 0.9rem; color: var(--color-text);">UPI ID: <strong>naturaglow@okaxis</strong></div>
                </div>

                <label style="display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: white; cursor: pointer;">
                  <input type="radio" name="payment-method" value="COD" onclick="togglePaymentView('COD')" />
                  <div>
                    <strong>Cash on Delivery (COD)</strong>
                    <div style="font-size: 0.85rem; color: var(--color-text-muted);">Pay securely with cash upon delivery at your doorstep</div>
                  </div>
                </label>

                <label style="display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: white; cursor: pointer;">
                  <input type="radio" name="payment-method" value="Card" onclick="togglePaymentView('Card')" />
                  <div>
                    <strong>Credit / Debit Card / Netbanking</strong>
                    <div style="font-size: 0.85rem; color: var(--color-text-muted);">Simulated secure 256-bit encrypted gateway</div>
                  </div>
                </label>
              </div>

              <button type="submit" class="btn btn-primary" style="margin-top: 1.5rem; padding: 1.1rem; font-size: 1.1rem; width: 100%;">Complete Order — ₹${total}</button>
            </form>
          </div>

          <div>
            <div style="background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 2rem; box-shadow: var(--shadow-subtle);">
              <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--color-text); border-bottom: 1px solid var(--color-border); padding-bottom: 0.75rem;">Order Review (${cart.reduce((s, i) => s + i.quantity, 0)} items)</h3>
              
              <div style="display: flex; flex-direction: column; gap: 1rem; max-height: 300px; overflow-y: auto; margin-bottom: 1.5rem;">
                ${cart.map(item => `
                  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
                    <div>
                      <div style="font-weight: 600; color: var(--color-text);">${item.name}</div>
                      <div style="color: var(--color-text-muted); font-size: 0.85rem;">Qty: ${item.quantity} × ₹${item.price}</div>
                    </div>
                    <div style="font-weight: 600; color: var(--color-text);">₹${item.price * item.quantity}</div>
                  </div>
                `).join('')}
              </div>

              <div style="border-top: 1px solid var(--color-border); padding-top: 1rem; display: flex; justify-content: space-between; color: var(--color-text-muted); margin-bottom: 0.75rem;">
                <span>Subtotal</span>
                <span>₹${subtotal}</span>
              </div>
              <div style="display: flex; justify-content: space-between; color: var(--color-text-muted); margin-bottom: 1rem;">
                <span>Shipping</span>
                <span>${shipping === 0 ? 'FREE' : '₹' + shipping}</span>
              </div>
              <div style="border-top: 1px solid var(--color-border); padding-top: 1rem; display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; color: var(--color-text);">
                <span>Total</span>
                <span>₹${total}</span>
              </div>
            </div>
          </div>
        </div>
      `;

      const style = document.createElement('style');
      style.textContent = `
        @media(min-width: 900px) {
          .checkout-grid {
            grid-template-columns: 3fr 2fr;
          }
        }
      `;
      document.head.appendChild(style);
    });

    window.togglePaymentView = function(method) {
      const qrBox = document.getElementById('upi-qr-box');
      if (qrBox) {
        qrBox.style.display = method === 'UPI' ? 'block' : 'none';
      }
    };

    window.handleCheckoutSubmit = function(e) {
      e.preventDefault();
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;
      const paymentMethod = document.querySelector('input[name="payment-method"]:checked').value;

      const cart = getCart();
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const shipping = subtotal >= 499 ? 0 : 99;
      const total = subtotal + shipping;
      const orderId = 'NG-' + Math.floor(100000 + Math.random() * 900000);

      // Build WhatsApp message
      let waText = `*New Order: ${orderId}*%0A%0A`;
      waText += `*Name:* ${encodeURIComponent(name)}%0A`;
      waText += `*Phone:* ${encodeURIComponent(phone)}%0A`;
      waText += `*Address:* ${encodeURIComponent(address)}%0A`;
      waText += `*Payment:* ${encodeURIComponent(paymentMethod)}%0A%0A`;
      waText += `*Items:*%0A`;
      cart.forEach(item => {
        waText += `- ${encodeURIComponent(item.name)} (x${item.quantity}) - ₹${item.price * item.quantity}%0A`;
      });
      waText += `%0A*Total Amount:* ₹${total}`;

      // Clear cart
      localStorage.removeItem('naturaglow_cart');

      // Show success modal / screen
      const wrapper = document.getElementById('checkout-wrapper');
      wrapper.innerHTML = `
        <div style="text-align: center; max-width: 600px; margin: 0 auto; background: var(--color-surface); padding: 3rem; border-radius: var(--radius-lg); border: 1px solid var(--color-border); box-shadow: var(--shadow-card);">
          <div style="font-size: 3.5rem; margin-bottom: 1rem;">🎉</div>
          <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--color-primary);">Order Placed Successfully!</h2>
          <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Order Reference: <strong>${orderId}</strong></p>
          
          <div style="background: #F4F7F5; padding: 1.5rem; border-radius: var(--radius-sm); text-align: left; margin-bottom: 2rem; font-size: 0.95rem;">
            <p style="margin-bottom: 0.5rem;"><strong>Shipping To:</strong> ${name}, ${phone}</p>
            <p style="margin-bottom: 0.5rem;"><strong>Address:</strong> ${address}</p>
            <p style="margin-bottom: 0.5rem;"><strong>Payment Mode:</strong> ${paymentMethod}</p>
            <p><strong>Total Paid:</strong> ₹${total} (${shipping === 0 ? 'Free Shipping' : 'Shipping Included'})</p>
          </div>

          <p style="margin-bottom: 1.5rem; color: var(--color-text-muted);">We have generated your order summary. Click below to send your order directly to our WhatsApp support team for fast processing!</p>

          <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="https://wa.me/919876543210?text=${waText}" target="_blank" class="btn btn-primary" style="background-color: #25D366; color: white;">💬 Send Order on WhatsApp</a>
            <a href="/" class="btn btn-outline">Return to Home</a>
          </div>
        </div>
      `;
    };
  </script>
</body>
</html>
